name: Lost Camera Media Forge Build

on:
  push:
    branches:
      - lost-camera-media-build
    paths:
      - '.github/workflows/lost-camera-media-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Restore Lost Camera Media source
        shell: bash
        run: |
          cat .build/lcm_v11.part1 .build/lcm_v11.part2 .build/lcm_v11.part3 .build/lcm_v11.part4 | base64 -d > /tmp/lcm.tar.gz
          echo '8528845693fcf492e90e8c3859d90f2e3fbad22aa9d0bbc444d6cb2fbcc7a933  /tmp/lcm.tar.gz' | sha256sum -c -
          rm -rf LostCameraMedia
          tar -xzf /tmp/lcm.tar.gz

      - name: Build Forge mod
        working-directory: LostCameraMedia
        run: gradle build --stacktrace --no-daemon

      - name: Package source
        shell: bash
        run: zip -qr Lost-Camera-Media-1.20.1-Source-1.1.0.zip LostCameraMedia -x 'LostCameraMedia/build/*' 'LostCameraMedia/.gradle/*'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lost-Camera-Media-Forge-1.20.1-v1.1.0
          if-no-files-found: error
          path: |
            LostCameraMedia/build/libs/*.jar
            Lost-Camera-Media-1.20.1-Source-1.1.0.zip
