name: Lost Camera Media Forge Build

on:
  push:
    branches:
      - lost-camera-media-build
    paths:
      - '.github/workflows/lost-camera-media-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Restore Lost Camera Media source
        shell: bash
        run: |
          cat .build/lcm.part1 .build/lcm.part2 .build/lcm.part3 | base64 -d > /tmp/lcm.tar.gz
          echo '52cc69f2601c034ce188c87b665eec252955ed2c0c08135fdb998d5e3f30a61e  /tmp/lcm.tar.gz' | sha256sum -c -
          tar -xzf /tmp/lcm.tar.gz

      - name: Build Forge mod
        working-directory: LostCameraMedia
        run: gradle build --stacktrace --no-daemon

      - name: Package source
        shell: bash
        run: zip -qr LostCameraMedia-source.zip LostCameraMedia -x 'LostCameraMedia/build/*' 'LostCameraMedia/.gradle/*'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lost-Camera-Media-Forge-1.20.1
          if-no-files-found: error
          path: |
            LostCameraMedia/build/libs/*.jar
            LostCameraMedia-source.zip
