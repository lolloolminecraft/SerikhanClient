name: Lost Camera Media Forge Build

on:
  push:
    branches:
      - lost-camera-media-build
    paths:
      - '.github/workflows/lost-camera-media-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Restore v1.1 source
        shell: bash
        run: |
          cat .build/lcm_v11.part1 .build/lcm_v11.part2 .build/lcm_v11.part3 .build/lcm_v11.part4 | base64 -d > /tmp/lcm.tar.gz
          echo '8528845693fcf492e90e8c3859d90f2e3fbad22aa9d0bbc444d6cb2fbcc7a933  /tmp/lcm.tar.gz' | sha256sum -c -
          rm -rf LostCameraMedia
          tar -xzf /tmp/lcm.tar.gz

      - name: Apply v1.2 source patch
        shell: bash
        run: |
          cat .build/lcm_v12_patch.part1 .build/lcm_v12_patch.part2 | base64 -d > /tmp/lcm-v12-patch.tar.gz
          echo '693b14abf7e248da958d296f91e8d09a00e35fd35b60d19d78b9aaf00b95a635  /tmp/lcm-v12-patch.tar.gz' | sha256sum -c -
          tar -xzf /tmp/lcm-v12-patch.tar.gz -C LostCameraMedia
          sed -i 's/20.0f - reviveTicks + event.getPartialTick()/20.0f - reviveTicks + (float) event.getPartialTick()/' LostCameraMedia/src/main/java/com/erzhan/lostcamera/client/CameraMotionController.java

      - name: Generate original horror camera audio
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python LostCameraMedia/tools/generate_audio.py

      - name: Build Forge mod
        working-directory: LostCameraMedia
        run: gradle build --stacktrace --no-daemon

      - name: Verify jar
        shell: bash
        run: |
          JAR=$(find LostCameraMedia/build/libs -maxdepth 1 -name '*.jar' | head -1)
          test -n "$JAR"
          jar tf "$JAR" | grep -q 'com/erzhan/lostcamera/client/CameraMotionController.class'
          jar tf "$JAR" | grep -q 'assets/lostcameramedia/sounds/camera_motor.ogg'
          jar tf "$JAR" | grep -q 'META-INF/THIRD_PARTY_NOTICES.txt'
          sha256sum "$JAR"

      - name: Package source
        shell: bash
        run: zip -qr Lost-Camera-Media-1.20.1-Source-1.2.0.zip LostCameraMedia -x 'LostCameraMedia/build/*' 'LostCameraMedia/.gradle/*'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lost-Camera-Media-Forge-1.20.1-v1.2.0-final
          if-no-files-found: error
          path: |
            LostCameraMedia/build/libs/*.jar
            Lost-Camera-Media-1.20.1-Source-1.2.0.zip
